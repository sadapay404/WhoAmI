name: Build APK

on:
  push:
    branches: ["arena/973c69c1-whoami", "main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build; on failure, re-emit every error line as a workflow annotation
      # so they're readable through the GitHub API (sandbox can't fetch raw logs).
      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Error lines"
            grep -nE "(^e: |error: |ERROR: |FAILURE:|Execution failed|Unresolved reference|Could not resolve|Could not find|A problem occurred|BUILD FAILED|Caused by:|Exception)" build-output.txt | tail -60 | sed 's/^/  /'
            echo "::endgroup::"
            grep -E "(^e: |error: |ERROR: |FAILURE:|Execution failed for task|Could not resolve|Could not find|A problem occurred|Caused by:)" build-output.txt | tail -30 | sed 's/::/%25::/g' | while IFS= read -r line; do
              echo "::error::${line}"
            done
            if ! grep -qE "(^e: |error: |ERROR: )" build-output.txt; then
              echo "::error::Gradle failed with exit $status. Last lines:"
              tail -25 build-output.txt | sed 's/::/%25::/g' | while IFS= read -r line; do
                echo "::error::${line}"
              done
            fi
          fi
          exit $status

      - name: Name APK with short SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/WhoAmI-${SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk dist/WhoAmI-latest.apk

      # Print the signer fingerprint so consecutive builds can be compared:
      # it must be identical across runs (stable committed keystore).
      - name: Verify signer fingerprint
        run: |
          fp=$(keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | grep -m1 "SHA256:" || true)
          if [ -z "$fp" ]; then
            APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | sort | tail -1)
            fp=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | grep -m1 "SHA-256 digest" || true)
          fi
          echo "::notice title=signer::$fp"
          # Expected: the committed keystore's fingerprint (BB:A8:29:58:...)
          echo "$fp" | grep -qi "BB:A8:29:58\|bba82958" \
            && echo "::notice title=signer-check::MATCHES stable keystore ✓" \
            || { echo "::error title=signer-check::DOES NOT match stable keystore!"; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhoAmI-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to rolling latest-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest-build dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create latest-build dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Latest Debug Build" \
              --notes "Automatic debug build from CI. Download WhoAmI-latest.apk, open it on your phone, allow install from your browser."
          fi
          echo "Release updated:" 
          gh release view latest-build --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

  # Signed-style release (still debug-keyed; see docs/USER_GUIDE §Install) —
  # runs only when a v* tag is pushed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Package
        run: |
          mkdir -p dist
          # AGP names the APK app-release.apk when a signing config is present
          src="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then src="app/build/outputs/apk/release/app-release-unsigned.apk"; fi
          cp "$src" "dist/WhoAmI-${GITHUB_REF_NAME}.apk"
          # sanity: an installable APK must contain a signature block
          if grep -aq "ANDROID" "dist/WhoAmI-${GITHUB_REF_NAME}.apk"; then echo "signature marker present"; fi
      - name: Verify release signer fingerprint
        run: |
          APK="dist/WhoAmI-${GITHUB_REF_NAME}.apk"
          fp=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep -m1 "SHA256:" || true)
          if [ -z "$fp" ]; then
            APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | sort | tail -1)
            fp=$(\"$APKSIGNER\" verify --print-certs "$APK" 2>/dev/null | grep -m1 "SHA-256 digest" || true)
          fi
          echo "::notice title=release-signer::$fp"
          echo "$fp" | grep -qi "BB:A8:29:58\|bba82958" \
            && echo "::notice title=release-signer-check::MATCHES stable keystore ✓" \
            || { echo "::error title=release-signer-check::RELEASE APK NOT SIGNED WITH STABLE KEYSTORE!"; exit 1; }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "WhoAmI $GITHUB_REF_NAME" \
            --notes "Install: download the APK to your phone → open → allow 'install unknown apps'. Full guide: docs/USER_GUIDE.md in the repo."
