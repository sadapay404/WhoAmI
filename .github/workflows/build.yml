name: Build APK

on:
  push:
    branches: ["arena/973c69c1-whoami", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Build; on failure, re-emit every error line as a workflow annotation
      # so they're readable through the GitHub API (sandbox can't fetch raw logs).
      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Error lines"
            grep -nE "(^e: |error: |ERROR: |FAILURE:|Execution failed|Unresolved reference|Could not resolve|Could not find|A problem occurred|BUILD FAILED|Caused by:|Exception)" build-output.txt | tail -60 | sed 's/^/  /'
            echo "::endgroup::"
            grep -E "(^e: |error: |ERROR: |FAILURE:|Execution failed for task|Could not resolve|Could not find|A problem occurred|Caused by:)" build-output.txt | tail -30 | sed 's/::/%25::/g' | while IFS= read -r line; do
              echo "::error::${line}"
            done
            if ! grep -qE "(^e: |error: |ERROR: )" build-output.txt; then
              echo "::error::Gradle failed with exit $status. Last lines:"
              tail -25 build-output.txt | sed 's/::/%25::/g' | while IFS= read -r line; do
                echo "::error::${line}"
              done
            fi
          fi
          exit $status

      - name: Name APK with short SHA
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/WhoAmI-${SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk dist/WhoAmI-latest.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhoAmI-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach to rolling latest-build release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Debug Build
          prerelease: true
          files: |
            dist/WhoAmI-latest.apk
            dist/WhoAmI-*.apk
          body: |
            Automatic debug build from CI.
            Install on your phone: download **WhoAmI-latest.apk**, open it, allow "install unknown apps" for your browser/file manager.
